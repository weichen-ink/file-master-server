<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7132f5" />
    <title>File Master</title>
    <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/admin/styles/tokens.css?v=web2" />
    <link rel="stylesheet" href="/assets/console.css?v=web3" />
    <link rel="stylesheet" href="/assets/admin/styles/components.css?v=web6" />
  </head>

    <a id="skip-link" class="skip-link" href="#page">跳转到内容</a>
    <div id="login" class="login-layout" hidden></div>

      <aside class="sidebar" id="sidebar-content"></aside>
      <div class="workspace">

          <button
            id="mobile-menu"
            class="icon-button"
            type="button"
            data-action="mobile-menu"
            aria-label="打开导航"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"

            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg></button
          ><strong id="mobile-heading">File Master</strong>
        </header>
        <main id="page" tabindex="-1">
          <div class="loading-state" role="status">正在连接服务…</div>
        </main>
      </div>
      <div id="dirty-indicator" class="dirty-indicator" hidden></div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      >File Master 需要启用 JavaScript / JavaScript is required.</noscript
    >
    <script type="module" src="/assets/console.js?v=web2"></script>
