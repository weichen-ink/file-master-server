<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Master Server</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: rgba(226, 232, 240, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-border: #d1fae5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --card-bg: #111827;
        --border: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --success: #34d399;
        --success-bg: rgba(16, 185, 129, 0.12);
        --success-border: rgba(16, 185, 129, 0.25);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(8px);
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #ffffff;
      box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.3);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% {
        box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
      }
      50% {
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.4);
      }
    }

    .heart {
      display: inline-block;
      animation: heartbeat 2.4s ease-in-out infinite;
      transform-origin: center;
      vertical-align: baseline;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      12% {
        transform: scale(1.14);
      }
      24% {
        transform: scale(1);
      }
      36% {
        transform: scale(1.10);
      }
      60% {
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart, .status-dot {
        animation: none;
      }
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .footer-copy {
      margin-top: 24px;
      font-size: 11.5px;
      color: var(--text-muted);
      opacity: 0.75;
      letter-spacing: 0.01em;
      text-align: center;
      line-height: 1.6;
    }

    .footer-copy a {
      color: inherit;
      text-decoration: none;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .footer-copy a:hover {
      color: var(--text-main);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="status-card">
    <div class="brand-icon">⚡</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">服务正常运行</span>
    </div>
    <h1 class="title">File Master Server</h1>
    <p class="subtitle" id="subtitleText">自建知识资产管理服务器</p>
  </div>

  <div class="footer-copy">
    © <span id="currentYear">2026</span> File Master · Made with <span class="heart">💗</span> by <a href="https://weichen.ink/" target="_blank" rel="noopener noreferrer">微尘</a> · <a href="https://github.com/weichen-ink/file-master-server" target="_blank" rel="noopener noreferrer">GitHub</a>
  </div>

  <script>
    (function() {
      var yearEl = document.getElementById('currentYear');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      var lang = 'zh';
      try {
        var stored = localStorage.getItem('filemaster_lang');
        if (stored === 'en' || stored === 'zh') {
          lang = stored;
        } else if (navigator.language && !navigator.language.toLowerCase().startsWith('zh')) {
          lang = 'en';
        }
      } catch (e) {}

      if (lang === 'en') {
        var statusEl = document.getElementById('statusText');
        if (statusEl) statusEl.textContent = 'Service Active';
        var subEl = document.getElementById('subtitleText');
        if (subEl) subEl.textContent = 'Self-hosted knowledge asset management server';
        document.documentElement.lang = 'en';
      }
    })();
  </script>
</body>
</html>
