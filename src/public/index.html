<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7132f5" />
  <title>File Master Server</title>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/admin/styles/tokens.css" />
  <link rel="stylesheet" href="/assets/public.css" />
</head>
<body>
  <button type="button" class="lang-toggle" id="btnLang" onclick="toggleLanguage()">English</button>

  <main class="status-card">
    <div class="brand-icon" aria-hidden="true">⚡</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">服务正常运行</span>
    </div>
    <h1 class="title">File Master Server</h1>
    <p class="subtitle" id="subtitleText">自建知识资产管理服务器</p>
  </main>

  <footer class="footer-copy">
    © <span id="currentYear">2026</span> File Master · Made with <span class="heart">💗</span> by <a href="https://weichen.ink/" target="_blank" rel="noopener noreferrer" id="authorLink">微尘</a> · <a href="https://github.com/weichen-ink/file-master-server" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

  <script src="/assets/public.js"></script>
  <script>
    (function() {
      var currentLang = 'zh';
      try {
        var stored = localStorage.getItem('filemaster_lang');
        if (stored === 'en' || stored === 'zh') {
          currentLang = stored;
        } else if (navigator.language && !navigator.language.toLowerCase().startsWith('zh')) {
          currentLang = 'en';
        }
      } catch (e) {}

      function updateUI(lang) {
        var isEn = lang === 'en';
        var statusEl = document.getElementById('statusText');
        if (statusEl) statusEl.textContent = isEn ? 'Service Active' : '服务正常运行';
        var subEl = document.getElementById('subtitleText');
        if (subEl) subEl.textContent = isEn
          ? 'Self-hosted knowledge asset management server'
          : '自建知识资产管理服务器';
        var authorEl = document.getElementById('authorLink');
        if (authorEl) authorEl.textContent = isEn ? 'Weichen' : '微尘';
        var langBtn = document.getElementById('btnLang');
        if (langBtn) langBtn.textContent = isEn ? '简体中文' : 'English';
        document.documentElement.lang = isEn ? 'en' : 'zh-CN';
      }

      updateUI(currentLang);

      window.toggleLanguage = function() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        try {
          localStorage.setItem('filemaster_lang', currentLang);
        } catch (e) {}
        updateUI(currentLang);
      };
    })();
  </script>
</body>
</html>
