<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FileMaster Server - 初始化安装向导</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --panel-alt: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .setup-card {
      width: 100%;
      max-width: 680px;
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 26px;
    }
    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .header p {
      color: var(--muted);
      font-size: 13.5px;
    }
    .section {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #93c5fd;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 9px 12px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus {
      border-color: var(--primary);
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-outline {
      background: var(--panel-alt);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-outline:hover {
      border-color: var(--primary);
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      margin-top: 6px;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .hint {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.4;
    }
    .opt-toggle-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .opt-toggle-box input {
      margin-top: 3px;
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="header">
      <span class="badge">✨ First-Time Setup Wizard</span>
      <h1>⚡ FileMaster 图床与资产服务初始化</h1>
      <p>检测到尚未创建 <code style="color:#93c5fd;">config.yaml</code>，请确认或自定义以下基础配置以完成初始化</p>
    </div>

    <div id="errBox" class="error-msg"></div>

    <form id="setupForm" onsubmit="submitSetup(event)">
      <!-- 1. 管理员账号与凭证 -->
      <div class="section">
        <div class="section-title">🔐 1. 管理员账号与 API 凭证</div>
        <div class="grid-2">
          <div class="form-group">
            <label>管理员用户名 (username)</label>
            <input type="text" id="s_username" class="form-input" value="admin" required />
          </div>
          <div class="form-group">
            <label>后台访问路径 (admin_path)</label>
            <input type="text" id="s_admin_path" class="form-input" value="admin" required />
            <div class="hint">默认通过 <code style="color:#93c5fd;">/admin</code> 访问管理台</div>
          </div>
        </div>

        <div class="form-group">
          <label>管理员登录密码 (password — 可直接使用生成的随机密码，或清空填写自己的密码)</label>
          <div class="input-row">
            <input type="text" id="s_password" class="form-input" placeholder="请输入管理员密码..." required />
            <button type="button" class="btn btn-outline" onclick="randomPass()">🎲 随机生成</button>
            <button type="button" class="btn btn-outline" onclick="document.getElementById('s_password').value=''; document.getElementById('s_password').focus();">🧹 清空自填</button>
          </div>
          <div class="hint">密码将在保存时使用 <code style="color:#93c5fd;">scrypt</code> 加盐哈希加密存储，不会明文落盘。</div>
        </div>

        <div class="form-group">
          <label>上传与插件 API Token (api_token)</label>
          <div class="input-row">
            <input type="text" id="s_api_token" class="form-input" required />
            <button type="button" class="btn btn-outline" onclick="randomToken()">🎲 重新生成</button>
          </div>
          <div class="hint">用于 Obsidian 插件或 PicList 上传鉴权。</div>
        </div>
      </div>

      <!-- 2. 图床路径与图片自动优化 -->
      <div class="section">
        <div class="section-title">🖼️ 2. 图床路径与自动优化功能</div>

        <label class="opt-toggle-box">
          <input type="checkbox" id="s_enable_optimization" checked onchange="toggleOptFields()" />
          <div>
            <div style="font-size:13.5px; font-weight:600; color:var(--text);">⚡ 开启图片自动优化 (WebP 压缩与处理后链接)</div>
            <div class="hint" style="margin-top:2px;">
              开启后，每张图片下方将同时展示 <strong>「📎 复制原始链接」</strong> 与 <strong>「⚡ 复制优化链接」</strong> 两个按钮；若关闭，则仅提供原始图片链接。
            </div>
          </div>
        </label>

        <div class="grid-3">
          <div class="form-group">
            <label>原始图片路径前缀 (raw)</label>
            <input type="text" id="s_raw_path" class="form-input" value="raw" required />
            <div class="hint">如 <code style="color:#93c5fd;">/raw/2026/10/a.png</code></div>
          </div>
          <div class="form-group" id="grp_webp_quality">
            <label>优化图 WebP 质量 (1-100)</label>
            <input type="number" id="s_webp_quality" class="form-input" value="82" min="10" max="100" />
          </div>
          <div class="form-group" id="grp_max_width">
            <label>优化图最大宽度 (px)</label>
            <input type="number" id="s_max_width" class="form-input" value="1920" min="0" />
          </div>
        </div>

        <div class="form-group" id="grp_watermark" style="margin-top:10px;">
          <label>优化图动态水印 (watermark_enable)</label>
          <select id="s_watermark_enable" class="form-input">
            <option value="true">开启水印 (默认在优化后的图片右下角添加水印)</option>
            <option value="false">关闭水印 (仅做 WebP 压缩与尺寸优化)</option>
          </select>
        </div>
      </div>

      <!-- 3. 站点与网络设置 -->
      <div class="section">
        <div class="section-title">🌐 3. 站点与服务端口</div>
        <div class="grid-3">
          <div class="form-group">
            <label>站点名称 (site_name)</label>
            <input type="text" id="s_site_name" class="form-input" value="FileMaster Server" required />
          </div>
          <div class="form-group">
            <label>外部访问地址 (base_url)</label>
            <input type="text" id="s_base_url" class="form-input" required />
          </div>
          <div class="form-group">
            <label>监听端口 (port)</label>
            <input type="number" id="s_port" class="form-input" value="3000" required />
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">🚀 完成初始化并进入管理后台</button>
    </form>
  </div>

  <script>
    function genRandomHex(len) {
      const arr = new Uint8Array(len);
      window.crypto.getRandomValues(arr);
      return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
    }

    function randomPass() {
      document.getElementById('s_password').value = genRandomHex(6);
    }

    function randomToken() {
      document.getElementById('s_api_token').value = 'fm_' + genRandomHex(16);
    }

    function toggleOptFields() {
      const enabled = document.getElementById('s_enable_optimization').checked;
      document.getElementById('grp_webp_quality').style.opacity = enabled ? '1' : '0.4';
      document.getElementById('grp_max_width').style.opacity = enabled ? '1' : '0.4';
      document.getElementById('grp_watermark').style.opacity = enabled ? '1' : '0.4';
    }

    async function loadDefaults() {
      document.getElementById('s_base_url').value = window.location.origin;
      randomPass();
      randomToken();
      try {
        const res = await fetch('/api/platform/setup-defaults');
        if (res.ok) {
          const d = await res.json();
          if (d.site_name) document.getElementById('s_site_name').value = d.site_name;
          if (d.port) document.getElementById('s_port').value = d.port;
          if (d.admin_path) document.getElementById('s_admin_path').value = d.admin_path;
          if (d.username) document.getElementById('s_username').value = d.username;
          if (d.suggested_password) document.getElementById('s_password').value = d.suggested_password;
          if (d.suggested_api_token) document.getElementById('s_api_token').value = d.suggested_api_token;
          if (d.raw_secret_path) document.getElementById('s_raw_path').value = d.raw_secret_path;
          if (d.enable_optimization !== undefined) {
            document.getElementById('s_enable_optimization').checked = Boolean(d.enable_optimization);
            toggleOptFields();
          }
        }
      } catch {}
    }

    async function submitSetup(e) {
      e.preventDefault();
      const errBox = document.getElementById('errBox');
      errBox.style.display = 'none';

      const password = document.getElementById('s_password').value.trim();
      if (!password) {
        errBox.textContent = '请填写管理员密码，或点击「随机生成」按钮生成密码。';
        errBox.style.display = 'block';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 正在保存配置并初始化...';

      const payload = {
        site_name: document.getElementById('s_site_name').value.trim(),
        base_url: document.getElementById('s_base_url').value.trim(),
        port: Number(document.getElementById('s_port').value) || 3000,
        admin_path: document.getElementById('s_admin_path').value.trim(),
        username: document.getElementById('s_username').value.trim(),
        password,
        api_token: document.getElementById('s_api_token').value.trim(),
        raw_secret_path: document.getElementById('s_raw_path').value.trim(),
        enable_optimization: document.getElementById('s_enable_optimization').checked,
        webp_quality: Number(document.getElementById('s_webp_quality').value) || 82,
        max_width: Number(document.getElementById('s_max_width').value) || 1920,
        watermark_enable: document.getElementById('s_watermark_enable').value === 'true'
      };

      try {
        const res = await fetch('/api/platform/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || '初始化失败');
        }
        window.location.href = data.redirectUrl || ('/' + payload.admin_path.replace(/^\/+/, ''));
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '🚀 完成初始化并进入管理后台';
      }
    }

    loadDefaults();
  </script>
</body>
</html>
