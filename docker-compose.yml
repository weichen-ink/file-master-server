services:
  file-master-server:
    build: .
    container_name: file-master-server
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    ports:
      - "3210:3210"
    environment:
      - NODE_ENV=production
      - PORT=3210
      - FILE_MASTER_CONFIG_DIR=/app/config
    volumes:
      - type: bind
        source: ./config
        target: /app/config
        bind:
          create_host_path: false
      - type: bind
        source: ./storage
        target: /app/storage
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      # Config is stored inside ./config/config.yaml so atomic saves never hit EBUSY.

