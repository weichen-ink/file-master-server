services:
  file-master-server:
    build: .
    container_name: file-master-server
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      - NODE_ENV=production
      - PORT=3210
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      # Note: On first run without config.yaml, visit http://localhost:3210/setup to initialize!
      # If you already have config.yaml, you can also mount it directly:
      # - ./config.yaml:/app/config.yaml

