services:
  file-master-server:
    build: .
    container_name: file-master-server
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      - NODE_ENV=production
      - PORT=3210
      - FILE_MASTER_CONFIG_DIR=/app/config
    volumes:
      - ./config:/app/config
      - ./storage:/app/storage
      - ./data:/app/data
      # Config is stored inside ./config/config.yaml so atomic saves never hit EBUSY.

